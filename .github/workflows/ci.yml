name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Validate bundled benchmark results
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("experiments/results/baseline.csv")
          with path.open(newline="", encoding="utf-8-sig") as file:
              rows = list(csv.DictReader(file))
          if len(rows) != 2880:
              raise SystemExit(f"Expected 2880 measurements, found {len(rows)}")
          if not rows or not rows[0].get("sourceFile"):
              raise SystemExit("Benchmark sourceFile metadata is missing")
          PY

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref_type != 'tag'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mpi-virtual-threads-research-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: mpi-virtual-threads-research-dashboard:ci

  release:
    name: Publish release and container images
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set container image names
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish benchmark image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish Python dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-dashboard:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}-dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

      - name: Package benchmark results
        run: |
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          files = [Path("experiments/results/baseline.csv")]
          with ZipFile("dist/benchmark-results.zip", "w", ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.as_posix())
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/benchmark-results.zip
            docker-compose.yml
